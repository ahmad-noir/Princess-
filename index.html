else{var a2=T*.55,ix=-24+Math.cos(a2)*5,iz=10+Math.sin(a2)*5,ih=-a2;if(leaveT&&T-leaveT<2.5){var lk2=ease((T-leaveT)/2.5);sw.position.set(DKX+(ix-DKX)*lk2,.15,DKZ+(iz-DKZ)*lk2);sw.rotation.y=-1.5708+wrap(ih+1.5708)*lk2}else{sw.position.set(ix,.15+Math.sin(T*2)*.04,iz);sw.rotation.y=ih}}
ST.forEach(function(s,i){if(i&&s.ring.visible){var q=1+Math.sin(T*3+i)*.1;s.ring.scale.set(q,q,q)}});

for(var i=parts.length-1;i>=0;i--){var q=parts[i];q.l-=dt;q.s.position.x+=q.vx*dt;q.s.position.y+=q.vy*dt;q.s.position.z+=q.vz*dt;q.s.material.opacity=clamp(q.l/q.L*1.6,0,1);if(q.l<=0){scene.remove(q.s);q.s.material.dispose();parts.splice(i,1)}}
if(fin){fwT-=dt;var ft=T-fin;if(ft>1&&fwT<=0){var nb=1+(rnd()<.45?1:0)+(ft>8&&rnd()<.4?1:0);for(var q3=0;q3<nb;q3++)launch();fwT=.22+rnd()*.3}
if(ft>7&&Math.floor(ft/9)!==fvl){fvl=Math.floor(ft/9);for(var q4=0;q4<7;q4++)setTimeout(launch,q4*160)}}
for(var i=rk.length-1;i>=0;i--){var r2=rk[i];r2.y+=r2.vy*dt;r2.s.position.set(r2.x,r2.y,r2.z);if(rnd()<.7)spawn("spark",r2.x,r2.y,r2.z,1,.2,{vy:-1,l:.6,s:.35,c:0xffd9a0,vx:.3});if(r2.y>=r2.cy){burst(r2.x,r2.cy,r2.z,r2.type);scene.remove(r2.s);rk.splice(i,1)}}
for(var i=fw.length-1;i>=0;i--){var f=fw[i];f.a+=dt;var ps=f.pt.geometry.attributes.position;for(var j=0;j<ps.count;j++){f.v[j*3+1]-=f.g*dt;ps.array[j*3]+=f.v[j*3]*dt;ps.array[j*3+1]+=f.v[j*3+1]*dt;ps.array[j*3+2]+=f.v[j*3+2]*dt;f.v[j*3]*=f.d;f.v[j*3+2]*=f.d}ps.needsUpdate=true;f.pt.material.opacity=Math.max(0,1-f.a/f.L);if(f.a>f.L){scene.remove(f.pt);f.pt.geometry.dispose();fw.splice(i,1)}}
/* camera */

else if(dance&&!moving){var du=T-dance,ca=1.57+Math.max(0,du)*.5,cr=du>8.2?6:9,chh=du>8.2?2.2:3.4;cp.set(CX+Math.cos(ca)*cr,CY+chh,CZ+Math.sin(ca)*cr);lk.set(CX,CY+1.5,CZ);cl=5}

cam.position.lerp(cp,Math.min(1,dt*cl));look.lerp(lk,Math.min(1,dt*(cl+1)));cam.lookAt(look);
